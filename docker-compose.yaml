services:

  postgres:
    image: postgres:16
    container_name: orbitra-postgres
    environment:
      POSTGRES_DB: orbitra_local
      POSTGRES_USER: erickbarrosr
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U erickbarrosr -d orbitra_local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbitra-network

  app:
    build: .
    container_name: orbitra-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orbitra_local?currentSchema=orbitra
      SPRING_DATASOURCE_USERNAME: erickbarrosr
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    networks:
      - orbitra-network

volumes:
  postgres_data:

networks:
  orbitra-network: